<text x="16" y="432" font-size="12" text-anchor="start" font-weight="normal" fill="#555555">These are static-mode measurements: no Director influenced the games. (a) A bar above 1 means an enemy type earns more reward per</text>
<text x="16" y="448" font-size="12" text-anchor="start" font-weight="normal" fill="#555555">unit of threat than the average type, whatever the player builds. (b) Eta squared is the share of the variance of the per-wave</text>
<text x="16" y="464" font-size="12" text-anchor="start" font-weight="normal" fill="#555555">reward of a type explained by the bot style (solid) or by the wave (hatched).</text>
