<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 492" width="960" height="492" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Reward signal diagnostics in static games</title>
<desc id="fig-desc">Bar charts of the reward ratio per enemy type and of the share of reward variance explained by style and wave, measured in static games.</desc>
