<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Win rate by style and mode</title>
<desc id="fig-desc">Dot and whisker chart of win rates with Wilson intervals for static, adaptive and random modes per bot style.</desc>
<rect width="960" height="600" fill="#ffffff"/>
