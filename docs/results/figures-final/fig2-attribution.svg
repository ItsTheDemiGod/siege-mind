<text x="816.3" y="30" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a1a1a">ESTIMATE (interval, no p-value)</text>
<text x="20" y="54" font-size="12" text-anchor="start" font-weight="normal" fill="#555555">N = 150 held-out seeds x 5 styles x 6 modes = 4500 games; primary population 614 units (static game reached wave 5)</text>
<text x="20" y="90" font-size="13" text-anchor="start" font-weight="bold" fill="#1a1a1a">Attribution of the extra lives lost by Director v1</text>
<line x1="376.29" y1="102" x2="376.29" y2="382" stroke="#d9d9d9" stroke-width="1"/>
<text x="376.29" y="397" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">-2.00</text>
<line x1="459.49" y1="102" x2="459.49" y2="382" stroke="#d9d9d9" stroke-width="1"/>
<text x="459.49" y="397" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">-1.00</text>
<line x1="542.69" y1="102" x2="542.69" y2="382" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="542.69" y="397" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">0.00</text>
<line x1="625.89" y1="102" x2="625.89" y2="382" stroke="#d9d9d9" stroke-width="1"/>
<text x="625.89" y="397" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">1.00</text>
<line x1="709.09" y1="102" x2="709.09" y2="382" stroke="#d9d9d9" stroke-width="1"/>
<text x="709.09" y="397" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">2.00</text>
