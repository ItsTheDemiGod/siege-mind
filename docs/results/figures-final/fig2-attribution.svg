<g data-id="adaptive-static"><text x="20" y="245" font-size="12" text-anchor="start" font-weight="normal" fill="#1a1a1a">Total: Director v1 - Static</text><rect x="542.69" y="233" width="119.9" height="16" fill="url(#pat-adaptive)" stroke="#D55E00" stroke-width="1.4" data-bar="adaptive-static" data-from="0" data-value="1.441111"/><line x1="638.86" y1="241" x2="688.92" y2="241" stroke="#D55E00" stroke-width="2" stroke-dasharray="6 3"/><line x1="638.86" y1="237" x2="638.86" y2="245" stroke="#D55E00" stroke-width="2"/><line x1="688.92" y1="237" x2="688.92" y2="245" stroke="#D55E00" stroke-width="2"/><path d="M 657.59 236 h 10 v 10 h -10 Z" fill="#D55E00" stroke="#D55E00" stroke-width="1.6"/><text x="754" y="245" font-size="12" text-anchor="start" font-weight="normal" fill="#555555">1.44 [1.16, 1.76]</text></g>
<text x="20" y="270" font-size="12" text-anchor="start" font-weight="bold" fill="#555555">Other arms (same metric, shown for comparison)</text>
