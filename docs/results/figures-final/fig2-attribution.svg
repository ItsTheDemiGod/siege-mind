<text x="545" y="415" font-size="12" text-anchor="middle" font-weight="normal" fill="#555555">difference in lives lost (a lost game counts as 20)</text>
<text x="20" y="118" font-size="12" text-anchor="start" font-weight="bold" fill="#555555">Lives lost against Static: parts add up to the total</text>
