<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1004" width="960" height="1004" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Figure 4. Style contrast by wave</title>
<desc id="fig-desc">Fixed-wave style contrast at waves 5, 9 and 13 for Director v1, Director v2, the counter arm, the prior control and the random control, with coverage.</desc>
