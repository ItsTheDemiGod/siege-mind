<text x="20" y="952" font-size="12" text-anchor="start" font-weight="normal" fill="#555555">Weight of a style on its predicted enemy type minus the mean of the other predicted-style games of the same seed, averaged</text>
<text x="20" y="968" font-size="12" text-anchor="start" font-weight="normal" fill="#555555">over seeds; coverage is the share of population units still observed at that wave. Prior and random are zero by construction.</text>
